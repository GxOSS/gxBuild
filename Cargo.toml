[package]
name = "gxbuild"
version = "1.0.1"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
libloading = { version = "0.8.6", optional = true }
thiserror = "1.0"
anyhow = "1.0"
crc32fast = "1.4"
rustpython-vm = { version = "0.4.0", optional = true }
rustpython-compiler = { version = "0.4.0", optional = true }
rustyline = { version = "14.0.0", optional = true }
zerocopy = { version = "0.8.3", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"], optional = true }
byteorder = "1.5.0"
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
chrono = "0.4"

[features]
default = ["cli", "python", "ffi", "tui"]
cli = ["dep:clap"]
python = ["dep:rustpython-vm", "dep:rustpython-compiler"]
ffi = ["dep:libloading"]
tui = ["dep:rustyline"]

[build-dependencies]
cc = "1.0"
