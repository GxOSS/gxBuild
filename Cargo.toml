[workspace]
members = ["crates/lzxc", "crates/stfs", "crates/xenon_types"]
resolver = "2"

[workspace.package]
version = "1.22.910"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
byteorder = "1.5.0"
bitflags = "2.0"
insta = "1"
sha-1 = "0.10"
num_enum = "0.7"
base64 = "0.22"
fskit = "0.1"
vfs = "0.12"
async-trait = "0.1" 
futures = "0.3"
jiff = "0.2"

[package]
name = "gxbuild"
version = "1.22.90"
edition = "2021"

[lib]
name = "libgxbuild"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rustyline = { version = "14.0.0", optional = true }
zerocopy = { version = "0.8.3", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"] }
byteorder = "1.5.0"
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
rhai = { version = "1.19.0", optional = true }
gxcrypt = { path = "../GxCrypt" }
stfs = { path = "crates/stfs" }

[features]
default = []
rhai = ["dep:rhai", "dep:rustyline"]
