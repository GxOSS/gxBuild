[workspace]
members = ["crates/lzxc", "crates/stfs", "crates/xenon_types"]
resolver = "2"

[workspace.package]
version = "1.22.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
byteorder = "1.5.0"
bitflags = "2.0"
insta = "1"
sha-1 = "0.10"
num_enum = "0.7"
base64 = "0.22"
fskit = "0.1"
vfs = "0.12"
async-trait = "0.1"
futures = "0.3"
jiff = "0.2"

[package]
name = "gxbuild"
version = "1.22.80"
edition = "2021"

[lib]
name = "libgxbuild"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = { version = "0.8.6", optional = true }
thiserror = "1.0"
anyhow = "1.0"
crc32fast = "1.4"
rustyline = { version = "14.0.0", optional = true }
zerocopy = { version = "0.8.3", features = ["derive"] }
clap = { version = "4.6.0", features = ["derive"], optional = true }
byteorder = "1.5.0"
log = "0.4"
fern = { version = "0.6", features = ["colored"] }
rhai = { version = "1.19.0", optional = true }
gxcrypt = { git = "https://github.com/GxOSS/GxCrypt" }

interoptopus = { version = "0.14", optional = true }
interoptopus_backend_c = { version = "0.14", optional = true }
interoptopus_backend_csharp = { version = "0.14", optional = true }

[features]
# Stock distribution: CLI binary + cdylib FFI surface + Rhai scripting/REPL.
default = ["cli", "ffi", "rhai"]
# CLI binary entrypoint (clap parser + ggx_cli driver). Without this, main.rs is a stub.
cli = ["dep:clap"]
# Interoptopus C/C# FFI surface (cdylib exports + bindings inventory).
ffi = ["dep:interoptopus", "dep:interoptopus_backend_c", "dep:interoptopus_backend_csharp"]
# Rhai scripting engine + rustyline REPL (--script <file>, --shell).
rhai = ["dep:rhai", "dep:rustyline"]

